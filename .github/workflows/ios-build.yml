name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS Framework (Simulator Arm64)
        run: ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64 --stacktrace

      - name: Build iOS Framework (Device Arm64)
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Copy Framework to iosApp
        run: |
          mkdir -p iosApp/iosApp/Frameworks
          cp -R shared/build/bin/iosSimulatorArm64/releaseFramework/Shared.framework iosApp/iosApp/Frameworks/

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build iOS App (Simulator)
        working-directory: iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload iOS Framework
        uses: actions/upload-artifact@v4
        with:
          name: ios-framework
          path: shared/build/bin/iosSimulatorArm64/releaseFramework/Shared.framework
          retention-days: 30

      - name: Upload iOS Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            shared/build/bin/
          retention-days: 7
